[package]
name = "multimeter-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shell-words = "1.1.1"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
chrono = "0.4.43"
is_elevated = "0.1.2"
libc = "1.0.0-alpha.2"
anyhow = "1.0.100"
lazy_static = "1.5.0"
regex = "1.12.2"
lm-sensors = "0.5.0"

[build-dependencies]
walkdir = "2.5.0"
