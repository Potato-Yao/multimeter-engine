[package]
name = "multimeter-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
multimeter-engine-macros = { path = "multimeter-engine-macros" }
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2+spec-1.1.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
chrono = "0.4.43"
is_elevated = "0.1.2"
libc = "1.0.0-alpha.2"
anyhow = "1.0.100"
lazy_static = "1.5.0"
regex = "1.12.2"
#lm-sensors = { git = "https://github.com/wiiznokes/lm-sensors.git", branch = "pwm" }
lm-sensors = { git = "https://codeberg.org/koutheir/lm-sensors" }
nvml-wrapper = "0.12.1"
#starship-battery = "0.11.0"
starship-battery = { git = "https://github.com/Potato-Yao/rust-battery" }
sysinfo = { version = "0.39.0", features = ["serde"] }
tracing = "0.1.44"
#tracing-subscriber = "0.3.23"
#lm-sensors = "0.5.0"

[build-dependencies]
walkdir = "2.5.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }

[[bench]]
name = "tcp_get_info_bench"
harness = false

[features]
fake-sensors = []
stress-test = []
web-api = []
native-api = []
